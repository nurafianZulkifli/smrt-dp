<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Screen Management | SMRT Buses</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --navy: #18243a;
            --muted: #68758a;
            --line: #e6eaf0;
            --surface: #ffffff;
            --canvas: #f4f6f9;
            --blue: #3b5f9b;
            --blue-dark: #294778;
            --red: #b71930;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: var(--navy);
            background:
                radial-gradient(circle at top right, rgba(59, 95, 155, 0.07), transparent 28rem),
                var(--canvas);
        }

        button, input, select, textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app-shell {
            max-width: 1180px;
            margin: 0 auto;
            padding: 38px 32px 64px;
        }

        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 24px;
        }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--red);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: var(--navy);
            font-size: 32px;
            line-height: 1.1;
            letter-spacing: -0.03em;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .toolbar,
        .ticker-card {
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--surface);
            box-shadow: 0 8px 24px rgba(24, 36, 58, 0.05);
        }

        .toolbar {
            display: grid;
            grid-template-columns: minmax(180px, 1fr) minmax(180px, 1fr) auto;
            gap: 16px;
            align-items: end;
            margin-bottom: 16px;
            padding: 18px;
        }

        .field {
            display: grid;
            gap: 7px;
        }

        .field label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        select,
        .add-form input,
        textarea {
            width: 100%;
            border: 1px solid #dfe4ec;
            border-radius: 8px;
            color: var(--navy);
            background: #fff;
            outline: none;
        }

        select {
            height: 42px;
            padding: 0 38px 0 12px;
        }

        select:focus,
        .add-form input:focus,
        textarea:focus {
            border-color: #7591bd;
            box-shadow: 0 0 0 3px rgba(59, 95, 155, 0.12);
        }

        .primary-button,
        .secondary-button,
        .danger-button,
        .icon-button {
            border: 0;
            border-radius: 8px;
            font-weight: 750;
            transition: 150ms ease;
        }

        .primary-button {
            min-height: 42px;
            padding: 0 16px;
            color: #fff;
            background: var(--blue);
        }

        .primary-button:hover { background: var(--blue-dark); }

        .secondary-button {
            min-height: 38px;
            padding: 0 13px;
            border: 1px solid #dfe4ec;
            color: var(--navy);
            background: #fff;
        }

        .secondary-button:hover,
        .icon-button:hover {
            border-color: #bec8d7;
            background: #f7f9fc;
        }

        .ticker-card {
            margin: 16px 0;
            padding: 20px;
        }

        .ticker-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .ticker-heading h3 {
            margin: 0;
            font-size: 15px;
        }

        .ticker-scope {
            display: flex;
            gap: 14px;
            margin-bottom: 12px;
        }

        .ticker-scope label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        .ticker-locations {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 8px;
            background: #f7f9fc;
        }

        .ticker-locations.active {
            display: flex;
        }

        .ticker-locations label {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 72px;
            color: var(--navy);
            font-size: 13px;
            font-weight: 700;
        }

        textarea {
            min-height: 72px;
            padding: 12px;
            resize: vertical;
            line-height: 1.5;
        }

        .ticker-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 10px;
        }

        .ticker-status-heading {
            margin: 16px 0 8px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .ticker-status-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        .ticker-location-status {
            min-width: 0;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fafbfd;
        }

        .ticker-location-status-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 7px;
        }

        .ticker-location-status strong {
            font-size: 13px;
        }

        .ticker-source {
            border-radius: 999px;
            padding: 3px 7px;
            color: #59677a;
            background: #edf1f6;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .ticker-location-status.override {
            border-color: #cfd9ea;
            background: #f5f8fd;
        }

        .ticker-location-status.override .ticker-source {
            color: var(--blue-dark);
            background: #dde7f5;
        }

        .ticker-location-status.default {
            border-style: dashed;
        }

        .ticker-location-status-text {
            min-height: 36px;
            margin: 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        #tickerStatus {
            color: #25804a;
            margin: 10px 0 0;
        }

        .screen-list {
            margin: 16px 0;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--surface);
            box-shadow: 0 8px 24px rgba(24, 36, 58, 0.05);
        }

        .section-heading {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
            padding: 16px 20px;
            border-bottom: 1px solid var(--line);
            font-size: 16px;
        }

        .section-count {
            min-width: 28px;
            padding: 3px 7px;
            border-radius: 999px;
            color: var(--blue);
            background: #edf2f9;
            font-size: 12px;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }

        th,
        td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--line);
            text-align: left;
        }

        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover { background: #fafbfd; }

        th {
            color: var(--muted);
            background: #fbfcfe;
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        td { font-size: 14px; }

        td a {
            color: var(--blue);
            text-decoration: none;
            overflow-wrap: anywhere;
        }

        td a:hover { text-decoration: underline; }

        .type-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 6px;
            color: #4d5d73;
            background: #eef1f5;
            font-size: 12px;
            font-weight: 800;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 7px;
        }

        .icon-button {
            min-height: 34px;
            padding: 0 10px;
            border: 1px solid #dfe4ec;
            color: var(--navy);
            background: #fff;
            font-size: 12px;
        }

        .icon-button.remove {
            color: #a51d32;
        }

        #addScreenModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 25, 43, 0.42);
            backdrop-filter: blur(4px);
        }

        .modal-card {
            width: min(460px, 100%);
            padding: 24px;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 24px 64px rgba(15, 25, 43, 0.24);
        }

        .modal-card h2 {
            margin: 0 0 18px;
            font-size: 20px;
        }

        .add-form {
            display: grid;
            gap: 10px;
        }

        .add-form input {
            height: 44px;
            padding: 0 12px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 8px;
        }

        @media (max-width: 720px) {
            .app-shell { padding: 24px 16px 48px; }
            .page-header { align-items: flex-start; }
            .header-actions { flex-wrap: wrap; justify-content: flex-end; }
            .toolbar { grid-template-columns: 1fr; }
            .ticker-status-grid { grid-template-columns: 1fr; }
            th:nth-child(3), td:nth-child(3) { display: none; }
            th, td { padding: 12px; }
            h1 { font-size: 26px; }
        }
    </style>
</head>

<body>
    <main class="app-shell">
    <header class="page-header">
        <div>
            <p class="eyebrow">SMRT Buses</p>
            <h1>Screen Management</h1>
        </div>
        <div class="header-actions">
            <a href="settings.html" class="primary-button" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; background: #3b5f9b; color: white; cursor: pointer; transition: all 0.2s;"><i class="fas fa-cog"></i> Settings</a>
            <button class="primary-button" onclick="openAddModal()"><i class="fas fa-plus"></i> Add Screen</button>
        </div>
    </header>

    <div class="toolbar">
        <div class="field">
            <label for="typeSelect">Screen type</label>
            <select id="typeSelect" onchange="renderScreens()">
                <option value="ALL">All types</option>
                <option value="BDP">BDP</option>
                <option value="MDP">MDP</option>
            </select>
        </div>
        <div class="field">
            <label for="locationSelect">Location</label>
            <select id="locationSelect" onchange="renderScreens()">
                <option value="ALL">All locations</option>
            </select>
        </div>
        <div style="display:flex;gap:8px;">
            <button class="secondary-button" onclick="document.getElementById('importConfigInput').click()">Import</button>
            <button class="secondary-button" onclick="exportConfig()">Export</button>
        </div>
    </div>

    <!-- Add Screen Modal -->
    <div id="addScreenModal">
        <div class="modal-card">
            <h2>Add Screen</h2>
            <div class="add-form">
                <input id="category" placeholder="Category (e.g. BPJ)" />
                <input id="screenType" placeholder="Type (BDP/MDP)" />
                <input id="screenName" placeholder="Screen Name" />
                <input id="screenUrl" placeholder="Screen URL" />
                <div class="modal-actions">
                    <button class="secondary-button" onclick="closeAddModal()">Cancel</button>
                    <button class="primary-button" onclick="addScreen()">Add Screen</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Import Config Button and File Input -->
    <input type="file" id="importConfigInput" accept=".json" style="display:none" onchange="importConfigFile(event)">
    <!-- Ticker Message Setting -->
    <div class="ticker-card">
        <div class="ticker-heading">
            <h3>Override Ticker Message</h3>
        </div>
        <div class="ticker-scope">
            <label><input type="radio" name="tickerScope" value="all" onchange="updateTickerScope()" checked> All screens</label>
            <label><input type="radio" name="tickerScope" value="selected" onchange="updateTickerScope()"> Selected locations</label>
        </div>
        <div id="tickerLocations" class="ticker-locations">
            <label><input type="checkbox" value="BNL"> BNL</label>
            <label><input type="checkbox" value="BPJ"> BPJ</label>
            <label><input type="checkbox" value="CCK"> CCK</label>
            <label><input type="checkbox" value="WDL"> WDL</label>
        </div>
        <textarea id="tickerOverride" rows="2" placeholder="Leave blank to use the default ticker message"></textarea>
        <div class="ticker-actions">
            <button class="secondary-button" onclick="clearTickerOverride()">Clear</button>
            <button class="primary-button" onclick="saveTickerOverride()">Save Changes</button>
        </div>
        <div id="tickerStatus" style="color:green; margin-top:8px; display:none;"></div>
        <p class="ticker-status-heading">Current ticker status</p>
        <div id="tickerStatusGrid" class="ticker-status-grid"></div>
    </div>

    <!-- Modal Structure -->
    <!-- ...existing modal code... -->

    <div id="sectionsContainer">
        <!-- Sections will be rendered here -->
    </div>
    </main>


    <!------------------------------------ Functionalities ------------------------------------>
    <script>
        // Load from localStorage or use example initial data
        let screens = [];
        const STORAGE_KEY = 'screenManagerScreens';

        function loadScreens() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                try {
                    screens = JSON.parse(data);
                    if (!screens.some(screen => screen.name && screen.name.toLowerCase().startsWith('wdl-'))) {
                        screens.push({ name: 'wdl-E1', url: 'smrt-mdp/wdl.html', type: 'MDP' });
                        saveScreens();
                    }
                } catch {
                    screens = [];
                }
            } else {
                screens = [
                    { name: 'bnl-E1', url: 'smrt-mdp/bnl.html', type: 'MDP' },
                    { name: 'bpj-B1', url: 'smrt-bdp/bpj/berth1.html', type: 'BDP' },
                    { name: 'bpj-B2', url: 'smrt-bdp/bpj/berth2.html', type: 'BDP' },
                    { name: 'bpj-B3', url: 'smrt-bdp/bpj/berth3.html', type: 'BDP' },
                    { name: 'bpj-E1', url: 'smrt-mdp/bpj.html', type: 'MDP' },
                    { name: 'cck-B1', url: 'smrt-bdp/cck/berth1.html', type: 'BDP' },
                    { name: 'cck-B2', url: 'smrt-bdp/cck/berth2.html', type: 'BDP' },
                    { name: 'cck-B3', url: 'smrt-bdp/cck/berth3.html', type: 'BDP' },
                    { name: 'cck-B4', url: 'smrt-bdp/cck/berth4.html', type: 'BDP' },
                    { name: 'cck-B5', url: 'smrt-bdp/cck/berth5.html', type: 'BDP' },
                    { name: 'cck-E1', url: 'smrt-mdp/cck.html', type: 'MDP' },
                    { name: 'wdl-E1', url: 'smrt-mdp/wdl.html', type: 'MDP' }
                ];
                saveScreens();
            }
        }

        function saveScreens() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(screens));
        }

        function getSections() {
            const sections = {};
            screens.forEach((screen, idx) => {
                const section = screen.name.split('-')[0].toUpperCase();
                if (!sections[section]) sections[section] = [];
                sections[section].push({ ...screen, idx });
            });
            return sections;
        }

        function getAllLocations(typeFilter = "ALL") {
            // Get unique section names from screens, filtered by type if needed
            const locations = new Set();
            screens.forEach(screen => {
                if (typeFilter === "ALL" || (screen.type && screen.type.toUpperCase() === typeFilter)) {
                    const section = screen.name.split('-')[0].toUpperCase();
                    locations.add(section);
                }
            });
            return Array.from(locations).sort();
        }

        function renderLocationDropdown() {
            const select = document.getElementById('locationSelect');
            const type = document.getElementById('typeSelect').value;
            // Save current selection
            const prev = select.value;
            // Remove all except "All"
            select.innerHTML = '<option value="ALL">All</option>';
            getAllLocations(type).forEach(loc => {
                const opt = document.createElement('option');
                opt.value = loc;
                opt.textContent = loc;
                select.appendChild(opt);
            });
            // Restore previous selection if possible
            if ([...select.options].some(o => o.value === prev)) {
                select.value = prev;
            }
        }

        function renderScreens() {
            renderLocationDropdown();
            const container = document.getElementById('sectionsContainer');
            container.innerHTML = '';
            const sections = getSections();
            const selectedLoc = document.getElementById('locationSelect').value;
            const selectedType = document.getElementById('typeSelect').value;
            let filteredSections = {};

            // Filter screens by type and location
            Object.keys(sections).forEach(section => {
                const filtered = sections[section].filter(screen => {
                    const typeMatch = selectedType === "ALL" || (screen.type && screen.type.toUpperCase() === selectedType);
                    const locMatch = selectedLoc === "ALL" || section === selectedLoc;
                    return typeMatch && locMatch;
                });
                if (filtered.length) filteredSections[section] = filtered;
            });

            Object.keys(filteredSections).sort().forEach(section => {
                const div = document.createElement('div');
                div.className = 'screen-list';
                div.innerHTML = `
                <h2 class="section-heading">${section}<span class="section-count">${filteredSections[section].length}</span></h2>
                <table>
                    <thead>
                        <tr>
                            <th style="width:24%">Screen Name</th>
                            <th style="width:14%">Type</th>
                            <th>Screen URL</th>
                            <th style="width:150px;text-align:right">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filteredSections[section].map(screen => `
                            <tr>
                                <td>${screen.name}</td>
                                <td><span class="type-badge">${screen.type ? screen.type.toUpperCase() : ''}</span></td>
                                <td><a href="${screen.url}" target="_blank">${screen.url}</a></td>
                                <td class="actions">
                                    <button class="icon-button" onclick="editScreen(${screen.idx})">Edit</button>
                                    <button class="icon-button remove" onclick="removeScreen(${screen.idx})">Remove</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
                container.appendChild(div);
            });
        }

        // Modal logic
        function openAddModal() {
            document.getElementById('addScreenModal').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('category').focus();
            }, 100);
        }
        function closeAddModal() {
            document.getElementById('addScreenModal').style.display = 'none';
            document.getElementById('category').value = '';
            document.getElementById('screenType').value = '';
            document.getElementById('screenName').value = '';
            document.getElementById('screenUrl').value = '';
        }

        // Override addScreen to close modal after adding
        function addScreen() {
            const category = document.getElementById('category').value.trim();
            const type = document.getElementById('screenType').value.trim().toUpperCase();
            const name = document.getElementById('screenName').value.trim();
            const url = document.getElementById('screenUrl').value.trim();
            if (!category || !type || !name || !url) {
                alert('Please enter category, type, name and URL.');
                return;
            }
            // Ensure screen name starts with category
            let finalName = name;
            if (!name.toLowerCase().startsWith(category.toLowerCase() + '-')) {
                finalName = category.toLowerCase() + '-' + name;
            }
            screens.push({ name: finalName, url, type });
            saveScreens();
            closeAddModal();
            renderScreens();
        }

        function removeScreen(idx) {
            if (confirm('Remove this screen?')) {
                screens.splice(idx, 1);
                saveScreens();
                renderScreens();
            }
        }

        function editScreen(idx) {
            const screen = screens[idx];
            const newName = prompt('Edit screen name:', screen.name);
            if (newName === null) return;
            const newType = prompt('Edit type (BDP/MDP):', screen.type || '');
            if (newType === null) return;
            const newUrl = prompt('Edit screen URL:', screen.url);
            if (newUrl === null) return;
            screens[idx] = { name: newName.trim(), url: newUrl.trim(), type: newType.trim().toUpperCase() };
            saveScreens();
            renderScreens();
        }

        loadScreens();
        renderScreens();

        function importConfigFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    let importedScreens = [];
                    let importedTicker = '';
                    let importedTickerConfig = null;
                    if (Array.isArray(imported)) {
                        // Backward compatibility: old format (array)
                        importedScreens = imported;
                    } else if (imported && Array.isArray(imported.screens)) {
                        importedScreens = imported.screens;
                        importedTicker = imported.tickerOverride || '';
                        importedTickerConfig = imported.tickerOverrides || null;
                    } else {
                        alert('Invalid config file format.');
                        return;
                    }
                    // Ensure each screen has a category field
                    screens = importedScreens.map(screen => {
                        let category = screen.category;
                        if (!category && screen.name) {
                            category = screen.name.split('-')[0].toLowerCase();
                        }
                        return { ...screen, category };
                    });
                    saveScreens();
                    if (typeof importedTicker === 'string') {
                        localStorage.setItem('screenManagerTickerOverride', importedTicker);
                        document.getElementById('tickerOverride').value = importedTicker;
                    }
                    if (importedTickerConfig) {
                        localStorage.setItem('screenManagerTickerOverrides', JSON.stringify(importedTickerConfig));
                    }
                    loadTickerOverride();
                    renderScreens();
                    alert('Config imported successfully.');
                } catch (err) {
                    alert('Error parsing config file.');
                }
                event.target.value = ''; // Reset input
            };
            reader.readAsText(file);
        }
        // --- Ticker Message Override Logic ---
        const TICKER_KEY = 'screenManagerTickerOverride';
        const TICKER_OVERRIDES_KEY = 'screenManagerTickerOverrides';

        function getTickerConfig() {
            try {
                const config = JSON.parse(localStorage.getItem(TICKER_OVERRIDES_KEY) || 'null');
                if (config && typeof config === 'object') {
                    return {
                        all: config.all || '',
                        locations: config.locations && typeof config.locations === 'object' ? config.locations : {}
                    };
                }
            } catch {}
            return { all: localStorage.getItem(TICKER_KEY) || '', locations: {} };
        }

        function updateTickerScope() {
            const selected = document.querySelector('input[name="tickerScope"]:checked').value === 'selected';
            document.getElementById('tickerLocations').classList.toggle('active', selected);
        }

        function renderTickerStatus() {
            const config = getTickerConfig();
            const grid = document.getElementById('tickerStatusGrid');
            grid.innerHTML = ['BNL', 'BPJ', 'CCK', 'WDL'].map(location => {
                const locationOverride = (config.locations[location] || '').trim();
                const allOverride = (config.all || '').trim();
                let source = 'Default';
                let text = 'Using the default/unified ticker message';
                let state = 'default';

                if (locationOverride) {
                    source = 'Location';
                    text = locationOverride;
                    state = 'override';
                } else if (allOverride) {
                    source = 'All screens';
                    text = allOverride;
                    state = 'override';
                }

                return `
                    <div class="ticker-location-status ${state}">
                        <div class="ticker-location-status-top">
                            <strong>${location}</strong>
                            <span class="ticker-source">${source}</span>
                        </div>
                        <p class="ticker-location-status-text">${text.replace(/[&<>"']/g, char => ({
                            '&': '&amp;',
                            '<': '&lt;',
                            '>': '&gt;',
                            '"': '&quot;',
                            "'": '&#039;'
                        })[char])}</p>
                    </div>
                `;
            }).join('');
        }

        function loadTickerOverride() {
            const config = getTickerConfig();
            const scopeAll = document.querySelector('input[name="tickerScope"][value="all"]');
            const scopeSelected = document.querySelector('input[name="tickerScope"][value="selected"]');
            const locations = Object.keys(config.locations).filter(location => config.locations[location]);

            if (locations.length) {
                scopeSelected.checked = true;
                document.getElementById('tickerOverride').value = config.locations[locations[0]] || '';
            } else {
                scopeAll.checked = true;
                document.getElementById('tickerOverride').value = config.all;
            }
            document.querySelectorAll('#tickerLocations input[type="checkbox"]').forEach(input => {
                input.checked = locations.includes(input.value);
            });
            updateTickerScope();
            renderTickerStatus();
        }

        function saveTickerOverride() {
            const val = document.getElementById('tickerOverride').value.trim();
            const scope = document.querySelector('input[name="tickerScope"]:checked').value;
            const config = getTickerConfig();

            if (scope === 'all') {
                config.all = val;
                localStorage.setItem(TICKER_KEY, val);
            } else {
                const selected = [...document.querySelectorAll('#tickerLocations input:checked')]
                    .map(input => input.value);
                if (!selected.length) {
                    alert('Select at least one location.');
                    return;
                }
                selected.forEach(location => {
                    if (val) config.locations[location] = val;
                    else delete config.locations[location];
                });
            }

            localStorage.setItem(TICKER_OVERRIDES_KEY, JSON.stringify(config));
            showTickerStatus('Ticker override saved.');
            renderTickerStatus();
        }

        function clearTickerOverride() {
            const scope = document.querySelector('input[name="tickerScope"]:checked').value;
            const config = getTickerConfig();
            if (scope === 'all') {
                config.all = '';
                localStorage.removeItem(TICKER_KEY);
            } else {
                document.querySelectorAll('#tickerLocations input:checked').forEach(input => {
                    delete config.locations[input.value];
                });
            }
            localStorage.setItem(TICKER_OVERRIDES_KEY, JSON.stringify(config));
            document.getElementById('tickerOverride').value = '';
            showTickerStatus('Ticker override cleared.');
            renderTickerStatus();
        }

        function showTickerStatus(msg) {
            const el = document.getElementById('tickerStatus');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 2000);
        }

        // --- Export ticker override for use by other screens ---
        function getTickerOverride() {
            const config = getTickerConfig();
            return config.all || '';
        }

        loadScreens();
        renderScreens();
        loadTickerOverride();

        function exportConfig() {
            const tickerConfig = getTickerConfig();
            const config = {
                screens: screens,
                tickerOverride: tickerConfig.all,
                tickerOverrides: tickerConfig
            };
            const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'screen-config.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>

</html>
